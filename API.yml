    # ─── TTS ──────────────────────────────────────────────────────────────────
    /api/tts/synthesize:
      post:
        tags:
          - "TTS (Text-to-Speech)"
        summary: Synthesize text to speech
        description: Converts text to audio using local Supertonic TTS model. Returns audio/wav stream.
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
                    minLength: 1
                    example: "Halo, saya siap membantu Anda."
                  voice:
                    type: string
                    enum: [M1, M2, M3, M4, M5, F1, F2, F3]
                    default: M1
                    example: "M1"
        responses:
          '200':
            description: Audio WAV stream
            content:
              audio/wav:
                schema:
                  type: string
                  format: binary
          '400':
            description: Bad request
          '500':
            description: TTS synthesis failed

    /api/tts/voices:
      get:
        tags:
          - "TTS (Text-to-Speech)"
        summary: Get available voices
        security: []
        responses:
          '200':
            description: List of available voices
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    voices:
                      type: array
                      items:
                        type: string
                      example: [M1, M2, M3, M4, M5, F1, F2, F3]
    
