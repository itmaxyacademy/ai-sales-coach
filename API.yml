  openapi: 3.0.3
  info:
    title: Sales AI Coach API Specification
    description: |
      Spesifikasi API untuk platform Sales AI Coach.
      
      ### Role-Based Access Control
      
      1. **karyawan**
        - Akses modul latihan (Course, Roleplay, Chat, Riwayat, Coaching Hint, Analisis Wajah).
        - Akses terbatas pada data milik sendiri.
        
      2. **manager**
        - Manajemen konten latihan dan evaluasi performa tim.
        - Fitur: Manajemen course, penugasan, dashboard tim, analitik, transkrip detail, konfigurasi SAW.
        - Akses terbatas pada `/api/manager/*`.
        
      3. **admin**
        - Operasional teknis sistem dan manajemen user.
        - Fitur: CRUD user global, reset password, hapus sesi, monitoring, notifikasi broadcast.
        - Akses terbatas pada `/api/admin/*`. Tidak bisa melihat transkrip sesi rep.
        
      4. **super_admin**
        - Akses global (mencakup hak akses Admin dan Manager).
        - Akses ke `/api/admin/*` dan `/api/manager/*`.
    version: 1.0.0
  servers:
    - url: http://localhost:5000
      description: Local Development Server
  tags:
    - name: "Authentication"
      description: "Endpoint registrasi dan login user."
    - name: "Karyawan (Sales Rep)"
      description: "Endpoint Karyawan (course, sesi roleplay, riwayat, analisis wajah)."
    - name: "Manager (Sales Manager)"
      description: "Endpoint Manager (manajemen course, penugasan, dashboard tim, analitik, leaderboard)."
    - name: "Admin (System Administrator)"
      description: "Endpoint Admin (manajemen user global, konfigurasi sistem, broadcast)."
    - name: "Super Admin (Owner)"
      description: "Endpoint Super Admin (akses penuh)."
    - name: "User Profile & Dashboard"
      description: "Endpoint profil, ganti password, dan dashboard personal."
    - name: "TTS (Text-to-Speech)"
      description: "Endpoint TTS menggunakan Supertonic (proxy ke port 5001)."
  security:
    - BearerAuth: []
  paths:
    # ─── AUTHENTICATION ────────────────────────────────────────────────────────
    /api/auth/register:
      post:
        tags:
          - "Authentication"
        summary: "Registrasi User Baru (Default role: karyawan)"
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [name, email, password]
                properties:
                  name:
                    type: string
                    example: "John Doe"
                  email:
                    type: string
                    format: email
                    example: "john@salescoach.ai"
                  password:
                    type: string
                    minLength: 6
                    example: "password123"
        responses:
          '201':
            description: Registrasi berhasil
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '409':
            description: Email sudah terdaftar
    /api/auth/login:
      post:
        tags:
          - "Authentication"
        summary: "Login User"
        security: []
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [email, password]
                properties:
                  email:
                    type: string
                    format: email
                    example: "hr@indotrack.co.id"
                  password:
                    type: string
                    example: "password123"
        responses:
          '200':
            description: Login berhasil
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/AuthResponse'
          '401':
            description: Email atau password salah
    # ─── COURSES (SCENARIOS) ───────────────────────────────────────────────────
    /api/courses:
      get:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mendapatkan list course yang tersedia"
        description: |
          - Untuk **karyawan**: Mengembalikan hanya course yang di-assign kepada mereka.
          - Untuk **manager/admin**: Mengembalikan semua course aktif.
        responses:
          '200':
            description: List course
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    courses:
                      type: array
                      items:
                        $ref: '#/components/schemas/CourseSummary'
      post:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Membuat course/skenario baru (Akses: Manager/Super Admin)"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseInput'
        responses:
          '201':
            description: Course berhasil dibuat
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    course:
                      $ref: '#/components/schemas/Course'
    /api/courses/{courseId}:
      get:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mendapatkan detail course & rubrik penilaiannya"
        parameters:
          - name: courseId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Detail course
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    course:
                      $ref: '#/components/schemas/CourseDetail'
      patch:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mengubah data course & rubrik (Akses: Manager/Super Admin)"
        parameters:
          - name: courseId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCourseInput'
        responses:
          '200':
            description: Course diperbarui
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    course:
                      $ref: '#/components/schemas/Course'
      delete:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Soft-delete course (Akses: Manager/Super Admin)"
        parameters:
          - name: courseId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Course dinonaktifkan
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "Course berhasil dinonaktifkan."
    # ─── TRAINING SESSIONS (ROLEPLAY CHAT) ─────────────────────────────────────
    /api/sessions/start:
      post:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Memulai Sesi Roleplay Latihan Baru"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [courseId]
                properties:
                  courseId:
                    type: string
                    format: uuid
                  assignmentId:
                    type: string
                    format: uuid
                    description: ID assignment terkait untuk mengubah status menjadi in_progress
        responses:
          '201':
            description: Sesi dibuat, mengembalikan opening statement dari AI
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    session:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        courseId:
                          type: string
                          format: uuid
                        status:
                          type: string
                          example: "active"
                        maxTurns:
                          type: integer
                          example: 15
                    openingMessage:
                      type: string
                      example: "Halo, saya Pak Arief. Ada keperluan apa ya menelepon?"
                    initialCoaching:
                      $ref: '#/components/schemas/CoachingHint'
                    customerState:
                      $ref: '#/components/schemas/CustomerState'
    /api/sessions/chat:
      post:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mengirimkan pesan/percakapan sales rep"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, message]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: "Selamat siang Pak Arief, saya dari HRSmart Pro ingin menawarkan integrasi sistem payroll otomatis."
        responses:
          '200':
            description: Respons dari customer AI, metrik update, dan coaching hint
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    customerResponse:
                      type: string
                      example: "Payroll otomatis? Waduh, kami sudah kapok pakai software HR. Vendor sebelumnya gagal implementasi."
                    postTurnCoaching:
                      $ref: '#/components/schemas/CoachingHint'
                    preTurnCoaching:
                      $ref: '#/components/schemas/CoachingHint'
                    customerState:
                      $ref: '#/components/schemas/CustomerState'
                    sessionMeta:
                      type: object
                      properties:
                        shouldEnd:
                          type: boolean
                          example: false
                        reason:
                          type: string
                          nullable: true
                          example: null
                        turnsRemaining:
                          type: integer
                          example: 14
    /api/sessions/complete:
      post:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Menyelesaikan Sesi Roleplay & Mengkalkulasi Laporan Evaluasi AI"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                  facialAnalyses:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacialFrameInput'
        responses:
          '200':
            description: Ringkasan hasil evaluasi dan rekomendasi
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    session:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          example: "completed"
                        totalScore:
                          type: integer
                          example: 78
                        outcome:
                          type: string
                          enum: [closed, follow_up, rejected]
                          example: "follow_up"
                    insightReport:
                      $ref: '#/components/schemas/InsightReport'
                    facialSummary:
                      $ref: '#/components/schemas/FacialSummary'
    /api/sessions/history:
      get:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mendapatkan riwayat 20 sesi terakhir yang selesai (Akses: Karyawan)"
        responses:
          '200':
            description: Riwayat sesi
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    sessions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          course:
                            type: object
                            properties:
                              title:
                                type: string
                              category:
                                type: string
                              difficulty:
                                type: string
                          totalScore:
                            type: integer
                          outcome:
                            type: string
                          turnCount:
                            type: integer
                          completedAt:
                            type: string
                            format: date-time
    /api/sessions/{sessionId}:
      get:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mendapatkan detail lengkap kueri transkrip & insight suatu sesi"
        parameters:
          - name: sessionId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Detail sesi lengkap beserta transkrip percakapan
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    session:
                      $ref: '#/components/schemas/SessionDetailBase'
                    insightReport:
                      $ref: '#/components/schemas/InsightReport'
                    facialSummary:
                      $ref: '#/components/schemas/FacialSummary'
                    transcript:
                      type: array
                      items:
                        $ref: '#/components/schemas/TranscriptMessage'
    # ─── TRAINING ASSIGNMENTS ──────────────────────────────────────────────────
    /api/assignments:
      get:
        tags:
          - "Karyawan (Sales Rep)"
        summary: "Mendapatkan daftar tugas latihan yang didelegasikan ke user saat ini (Akses: Karyawan)"
        responses:
          '200':
            description: List assignments
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    assignments:
                      type: array
                      items:
                        $ref: '#/components/schemas/Assignment'
    /api/assignments/bulk:
      post:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Meng-assign Course ke banyak Rep sekaligus (Akses: Manager/Super Admin)"
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                required: [courseId, userIds]
                properties:
                  courseId:
                    type: string
                    format: uuid
                  userIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  dueAt:
                    type: string
                    format: date-time
                  note:
                    type: string
                    example: "Tolong pelajari produk knowledge-nya terlebih dahulu."
        responses:
          '200':
            description: Hasil delegasi massal
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AssignmentBase'
    /api/assignments/{id}:
      get:
        tags:
          - "Assignments (Penugasan)"
        summary: "Mendapatkan detail penugasan spesifik beserta status dan sesi terkait (Akses: Karyawan pemilik/Manager/Super Admin)"
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Detail penugasan berhasil diambil
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        courseId:
                          type: string
                          format: uuid
                        userId:
                          type: string
                          format: uuid
                        assignedById:
                          type: string
                          format: uuid
                        note:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [pending, in_progress, completed]
                        dueAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        completedAt:
                          type: string
                          format: date-time
                          nullable: true
                        course:
                          $ref: '#/components/schemas/CourseSummary'
                        assignedBy:
                          $ref: '#/components/schemas/User'
                        session:
                          type: array
                          items:
                            $ref: '#/components/schemas/SessionDetailBase'
    /api/assignments/{id}/remind:
      post:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mengirim notifikasi reminder manual ke Karyawan untuk tugas terkait (Akses: Manager/Super Admin)"
        parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Notifikasi terkirim
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: "Notifikasi reminder terkirim"
    # ─── MANAGER MODULE ────────────────────────────────────────────────────────
    /api/manager/dashboard:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan data dashboard manager (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Metrik ringkasan performa tim
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        teamCompletionRate:
                          type: integer
                          example: 75
                        teamAvgScore:
                          type: object
                          properties:
                            current:
                              type: integer
                              example: 82
                            delta:
                              type: integer
                              example: 4
                        activeSessions:
                          type: integer
                          example: 2
                        dueDateAlerts:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              userName:
                                type: string
                              courseTitle:
                                type: string
                              dueAt:
                                type: string
                                format: date-time
                        scoreDropAlerts:
                          type: array
                          items:
                            type: object
                            properties:
                              userId:
                                type: string
                              name:
                                type: string
                              latestScore:
                                type: integer
                              averagePrevious:
                                type: integer
                              drop:
                                type: integer
                        top3Ranking:
                          type: array
                          items:
                            $ref: '#/components/schemas/LeaderboardRow'
    /api/manager/team:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan list karyawan beserta skor SAW & performa (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Daftar karyawan tim
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          sawScore:
                            type: number
                            example: 0.875
                          sawRank:
                            type: integer
                            nullable: true
                            example: 1
                          avgScore:
                            type: integer
                            example: 81
                          completionRate:
                            type: integer
                            example: 100
                          lastActive:
                            type: string
                            format: date-time
                            nullable: true
    /api/manager/team/{userId}:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan detail profil & performa bulanan karyawan spesifik (Akses: Manager/Super Admin)"
        parameters:
          - name: userId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Metrik detail performa karyawan
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        profile:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            email:
                              type: string
                            createdAt:
                              type: string
                        sawDetail:
                          type: object
                          properties:
                            userId:
                              type: string
                            criteriaValues:
                              type: object
                            normalizedValues:
                              type: object
                            sawScore:
                              type: number
                            rank:
                              type: integer
                        trend30Days:
                          type: array
                          items:
                            type: object
                            properties:
                              sessionId:
                                type: string
                              score:
                                type: integer
                              completedAt:
                                type: string
                                format: date-time
                        recentSessions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              courseTitle:
                                type: string
                              score:
                                type: integer
                              outcome:
                                type: string
                              completedAt:
                                type: string
    /api/manager/team/{userId}/sessions:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan seluruh sesi latihan karyawan tertentu (Akses: Manager/Super Admin)"
        parameters:
          - name: userId
            in: path
            required: true
            schema:
              type: string
              format: uuid
          - name: courseId
            in: query
            required: false
            schema:
              type: string
          - name: outcome
            in: query
            required: false
            schema:
              type: string
        responses:
          '200':
            description: Daftar sesi
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ManagerSessionItem'
    /api/manager/team/{userId}/assignments:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan seluruh penugasan karyawan tertentu (Akses: Manager/Super Admin)"
        parameters:
          - name: userId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Daftar assignment
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          courseTitle:
                            type: string
                          status:
                            type: string
                          dueAt:
                            type: string
                          completedAt:
                            type: string
    /api/manager/sessions/{sessionId}:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan detail audit sesi (termasuk transkrip lengkap) untuk dipantau manager (Akses: Manager/Super Admin)"
        parameters:
          - name: sessionId
            in: path
            required: true
            schema:
              type: string
              format: uuid
        responses:
          '200':
            description: Sesi detail beserta transkrip
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ManagerAuditSessionDetail'
    /api/manager/analytics/overview:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan overview analisis performa global perusahaan (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Metrik perbandingan bulan lalu vs bulan ini
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        overview:
                          type: object
                          properties:
                            avgScore:
                              type: integer
                            outcomeRate:
                              type: integer
                            completionRate:
                              type: integer
                        comparison:
                          type: object
                          properties:
                            avgScore:
                              type: integer
                            outcomeRate:
                              type: integer
                            completionRate:
                              type: integer
                        sessionsPerDay:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                              count:
                                type: integer
    /api/manager/analytics/leaderboard:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan list leaderboard SAW bulanan terlengkap (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Leaderboard SAW
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    leaderboard:
                      type: array
                      items:
                        $ref: '#/components/schemas/LeaderboardRow'
    /api/manager/analytics/courses:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan analisis keefektifan course skenario (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Metrik detail performa tiap course
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        courses:
                          type: array
                          items:
                            $ref: '#/components/schemas/CourseAnalyticsItem'
                        hardestCourse:
                          $ref: '#/components/schemas/CourseAnalyticsItem'
                        mostAbandoned:
                          $ref: '#/components/schemas/CourseAnalyticsItem'
    /api/manager/analytics/trends:
      get:
        tags:
          - "Manager (Sales Manager)"
          - "Super Admin (Owner)"
        summary: "Mendapatkan data grafik tren penyelesaian & DAU mingguan (Akses: Manager/Super Admin)"
        responses:
          '200':
            description: Data tren
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        weeklyTrends:
                          type: array
                          items:
                            type: object
                            properties:
                              week:
                                type: string
                              avgScore:
                                type: integer
                              outcomeRate:
                                type: integer
                        activeUsersPerDay:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
